server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # WebCodecs needs a secure context: serve ClipMill over HTTPS in production.
  # Put this container behind your own TLS terminator (Caddy, Traefik, nginx-proxy…).

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  # Hashed assets never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Font slices change with the package version, keep them warm for a month.
  location ~* \.(woff2|woff|ttf)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
